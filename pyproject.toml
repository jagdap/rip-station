[project]
name = "rip-station"
version = "0.2.0"
description = "Automated DVD ripping into Plex: makemkvcon + local LLM naming + web dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[project.scripts]
rip-station = "ripstation.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["uv_build>=0.8.20,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ripstation"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
